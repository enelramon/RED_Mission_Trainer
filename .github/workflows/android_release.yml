name: "Build and Release APK"

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  export-android:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # El runner de GitHub (ubuntu-latest) ya trae el Android SDK preinstalado
      # en $ANDROID_SDK_ROOT. Usamos ese SDK directamente en lugar de
      # android-actions/setup-android, que falla al aceptar licencias.
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # Aceptar licencias (yes alimenta todos los prompts; no abortar si ya estaban aceptadas)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # Asegurar los componentes que Godot necesita para firmar/empaquetar el APK
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot 4.6
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip Godot_v4.6-stable_linux.x86_64.zip
          mv Godot_v4.6-stable_linux.x86_64 godot.exec
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip Godot_v4.6-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.6.stable
          mv ~/.local/share/godot/export_templates/4.6.stable/templates/* ~/.local/share/godot/export_templates/4.6.stable/

      - name: Generate Android debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.android/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Create Export Directory
        run: mkdir -p export

      # Importamos los recursos en un proceso aparte ANTES de exportar.
      # Si se importa y exporta en la misma invocacion, el estado del sistema de
      # archivos no esta listo y el export falla con "configuration errors".
      # El import puede devolver codigo != 0 por no poder guardar editor settings
      # en el runner; eso es inofensivo, por eso usamos "|| true".
      - name: Import Project Resources
        run: |
          ./godot.exec --headless --path . --import || true

      # IMPORTANTE: este paso va DESPUES del import. El import (modo editor) crea
      # su propio editor_settings-4.6.tres con valores por defecto; si escribieramos
      # la config antes, el import la sobrescribiria y el export no veria el SDK ni
      # el keystore (fallando con "configuration errors" sin detalle).
      #
      # El nombre del archivo debe coincidir con la version MINOR de Godot
      # (editor_settings-4.6.tres, no -4.tres), que es el que Godot 4.6 lee.
      #
      # Se configura solo el keystore de DEBUG: al exportar con --export-release sin
      # keystore de release, Godot firma el APK con el de debug (suficiente para
      # instalar y probar). NO definimos GODOT_ANDROID_KEYSTORE_RELEASE_*: setearlas
      # activa una validacion estricta que hace fallar el export.
      - name: Configure Godot editor settings (Android SDK + keystore)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Build APK
        run: |
          # --export-release "Android" fuerza a Godot a usar el preset de Android
          ./godot.exec --headless --path . --export-release "Android" export/RED_Mission_Trainer.apk

      - name: Verify APK exists
        run: |
          ls -lh export/RED_Mission_Trainer.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: "RED Mission Trainer - Build ${{ github.run_number }}"
          files: export/RED_Mission_Trainer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
